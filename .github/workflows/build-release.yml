name: Build and Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "21"
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  verify:
    name: Validate release version and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint --if-present
      - run: npm test

  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      repository: ${{ steps.metadata.outputs.repository }}
      repository_name: ${{ steps.metadata.outputs.repository_name }}
      title: ${{ steps.metadata.outputs.title }}
    steps:
      - uses: actions/checkout@v4
      - id: metadata
        name: Read and validate config.json
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const app = require("./config.json").application;
          if (!app?.version || !app?.repository?.owner || !app?.repository?.name || !app?.displayName) throw new Error("Missing release metadata in config.json.");
          const values = { version: app.version, tag: `v${app.version}`, repository: `${app.repository.owner}/${app.repository.name}`, repository_name: app.repository.name, title: app.displayName };
          fs.appendFileSync(process.env.GITHUB_OUTPUT, Object.entries(values).map(([key, value]) => `${key}=${value}\n`).join(""));
          NODE

  prepare-release:
    name: Prepare private GitHub release
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - name: Create or validate draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
          REPOSITORY: ${{ needs.metadata.outputs.repository }}
          TITLE: ${{ needs.metadata.outputs.title }}
        run: |
          if json="$(gh release view "$TAG" --repo "$REPOSITORY" --json isDraft 2>/dev/null)"; then
            test "$(jq -r .isDraft <<<"$json")" = true || { echo "Release $TAG is already published; refusing to modify it."; exit 1; }
            echo "Reusing draft release $TAG."
          else
            gh release create "$TAG" --repo "$REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE $TAG" --generate-notes --draft
          fi

  package-windows:
    name: Package and upload Windows artifacts
    runs-on: windows-latest
    needs: [metadata, prepare-release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: electron-${{ runner.os }}-x64-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-x64-
      - run: npm ci
      - run: npm run build:renderer
      - run: npm run build:electron
      - run: npm run build:server
      - name: Build Windows Setup, Portable and Portable Fast
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npx electron-builder --win nsis portable dir --x64 --publish never
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { exit $LASTEXITCODE }
            Write-Warning "electron-builder failed on attempt $attempt; retrying in 10 seconds."
            Start-Sleep -Seconds 10
          }
      - run: node scripts/package-portable-fast.mjs
      - name: Validate and checksum Windows artifacts
        shell: bash
        run: |
          test -n "$(find release -maxdepth 1 -name '*-Setup-*-x64.exe' -print -quit)"
          test -n "$(find release -maxdepth 1 -name '*-Portable-*-x64.exe' -print -quit)"
          test -n "$(find release -maxdepth 1 -name '*-Portable-Fast-*-x64.zip' -print -quit)"
          test -n "$(find release -maxdepth 1 -name '*.blockmap' -print -quit)"
          test -f release/latest.yml
          find release -maxdepth 1 -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.yml' -o -name '*.blockmap' \) -print0 | sort -z | xargs -0 sha256sum > release/SHA256SUMS.txt
      - name: Upload Windows artifacts directly
        shell: bash
        env:
          CDN_BASE_URL: ${{ secrets.CDN_BASE_URL }}
          CDN_UPLOAD_KEY: ${{ secrets.CDN_UPLOAD_KEY }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
          REPOSITORY: ${{ needs.metadata.outputs.repository }}
          REPOSITORY_NAME: ${{ needs.metadata.outputs.repository_name }}
        run: |
          mapfile -d '' -t assets < <(find release -maxdepth 1 -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.yml' -o -name '*.blockmap' -o -name 'SHA256SUMS.txt' \) -print0)
          upload_args=(); for asset in "${assets[@]}"; do upload_args+=(--file "$asset"); done
          node scripts/upload-cdn-release.mjs upload --repository "$REPOSITORY_NAME" --version "$TAG" --platform windows "${upload_args[@]}"
          gh release upload "$TAG" "${assets[@]}" --repo "$REPOSITORY" --clobber

  package-linux:
    name: Package and upload Linux artifacts
    runs-on: ubuntu-latest
    needs: [metadata, prepare-release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: electron-${{ runner.os }}-x64-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-x64-
      - run: npm ci
      - run: npm run build:renderer
      - run: npm run build:electron
      - run: npm run build:server
      - name: Build Linux artifacts and updater metadata
        run: |
          for attempt in 1 2 3; do
            if npx electron-builder --linux AppImage deb --x64 --publish never; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "electron-builder failed on attempt $attempt; retrying in 10 seconds."; sleep 10
          done
      - name: Validate and checksum Linux artifacts
        run: |
          test -n "$(find release -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$(find release -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$(find release -maxdepth 1 -name '*.blockmap' -print -quit)"
          test -f release/latest-linux.yml
          find release -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.blockmap' -o -name 'latest-linux.yml' \) -print0 | sort -z | xargs -0 sha256sum > release/SHA256SUMS-linux.txt
      - name: Upload Linux artifacts directly
        env:
          CDN_BASE_URL: ${{ secrets.CDN_BASE_URL }}
          CDN_UPLOAD_KEY: ${{ secrets.CDN_UPLOAD_KEY }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
          REPOSITORY: ${{ needs.metadata.outputs.repository }}
          REPOSITORY_NAME: ${{ needs.metadata.outputs.repository_name }}
        run: |
          mapfile -d '' -t assets < <(find release -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.blockmap' -o -name 'latest-linux.yml' -o -name 'SHA256SUMS-linux.txt' \) -print0)
          upload_args=(); for asset in "${assets[@]}"; do upload_args+=(--file "$asset"); done
          node scripts/upload-cdn-release.mjs upload --repository "$REPOSITORY_NAME" --version "$TAG" --platform linux "${upload_args[@]}"
          gh release upload "$TAG" "${assets[@]}" --repo "$REPOSITORY" --clobber

  package-android:
    name: Package and upload Android APKs
    runs-on: ubuntu-latest
    needs: [metadata, prepare-release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - uses: android-actions/setup-android@v3
      - id: android_config
        run: |
          echo "platform=android-$(node -p 'require("./config.json").android.compileSdkVersion')" >> "$GITHUB_OUTPUT"
          echo "build_tools=$(node -p 'require("./config.json").android.buildToolsVersion')" >> "$GITHUB_OUTPUT"
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;${{ steps.android_config.outputs.platform }}" "build-tools;${{ steps.android_config.outputs.build_tools }}"
      - run: npm ci
      - run: npm run build:renderer
      - run: npm run cap:sync
      - name: Test and build APKs
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
      - name: Validate and checksum Android APKs
        run: |
          test -n "$(find android/app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$(find android/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          find android/app/build/outputs/apk -type f -name '*.apk' -print0 | sort -z | xargs -0 sha256sum > android/app/build/outputs/apk/SHA256SUMS-android.txt
      - name: Upload Android artifacts directly
        env:
          CDN_BASE_URL: ${{ secrets.CDN_BASE_URL }}
          CDN_UPLOAD_KEY: ${{ secrets.CDN_UPLOAD_KEY }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
          REPOSITORY: ${{ needs.metadata.outputs.repository }}
          REPOSITORY_NAME: ${{ needs.metadata.outputs.repository_name }}
        run: |
          mapfile -d '' -t assets < <(find android/app/build/outputs/apk -type f \( -name '*.apk' -o -name 'SHA256SUMS-android.txt' \) -print0)
          test "${#assets[@]}" -ge 3
          upload_args=(); for asset in "${assets[@]}"; do upload_args+=(--file "$asset"); done
          node scripts/upload-cdn-release.mjs upload --repository "$REPOSITORY_NAME" --version "$TAG" --platform android "${upload_args[@]}"
          gh release upload "$TAG" "${assets[@]}" --repo "$REPOSITORY" --clobber

  finalize-cdn:
    name: Finalize CDN and publish private GitHub release
    runs-on: ubuntu-latest
    needs: [metadata, package-windows, package-linux, package-android]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Read release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
          REPOSITORY: ${{ needs.metadata.outputs.repository }}
        run: gh release view "$TAG" --repo "$REPOSITORY" --json body --jq .body > release-notes.md
      - name: Finalize CDN release
        env:
          CDN_BASE_URL: ${{ secrets.CDN_BASE_URL }}
          CDN_UPLOAD_KEY: ${{ secrets.CDN_UPLOAD_KEY }}
          TAG: ${{ needs.metadata.outputs.tag }}
          REPOSITORY_NAME: ${{ needs.metadata.outputs.repository_name }}
          TITLE: ${{ needs.metadata.outputs.title }}
        run: node scripts/upload-cdn-release.mjs finalize --repository "$REPOSITORY_NAME" --tag "$TAG" --commit-sha "$GITHUB_SHA" --title "$TITLE $TAG" --date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --notes-file release-notes.md
      - name: Publish private GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
          REPOSITORY: ${{ needs.metadata.outputs.repository }}
        run: gh release edit "$TAG" --repo "$REPOSITORY" --draft=false --latest
