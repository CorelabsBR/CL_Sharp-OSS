name: Build and Release

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag. Empty uses v<package.version>-<run_number>."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "17"

jobs:
  test:
    name: Test and compile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build renderer
        run: npm run build:renderer

      - name: Build Electron main/preload
        run: npm run build:electron

  package-windows:
    name: Package Windows installer and portable
    runs-on: windows-latest
    needs: test
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: |
          npm run build:renderer
          npm run build:electron

      - name: Build Windows artifacts
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml

  package-linux:
    name: Package Linux deb and portable
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: |
          npm run build:renderer
          npm run build:electron

      - name: Build Linux artifacts
        run: npx electron-builder --linux deb AppImage --x64 --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          if-no-files-found: error
          path: |
            release/*.deb
            release/*.AppImage
            release/latest*.yml

  package-android:
    name: Package Android APK
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npm run cap:sync

      - name: Build APKs
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          if-no-files-found: error
          path: android/app/build/outputs/apk/**/*.apk

  release:
    name: Create tag and GitHub release
    runs-on: ubuntu-latest
    needs:
      - package-windows
      - package-linux
      - package-android
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          tag_name="${{ inputs.tag_name }}"
          if [ -z "$tag_name" ]; then
            version="$(node -p "require('./package.json').version")"
            tag_name="v${version}-${GITHUB_RUN_NUMBER}"
          fi
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        shell: bash
        run: |
          tag_name="${{ steps.release_tag.outputs.tag_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "refs/tags/$tag_name" >/dev/null 2>&1; then
            echo "Tag $tag_name already exists."
          else
            git tag -a "$tag_name" -m "Release $tag_name"
            git push origin "$tag_name"
          fi

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_name="${{ steps.release_tag.outputs.tag_name }}"
          mapfile -t assets < <(find release-assets -type f | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found."
            exit 1
          fi

          if gh release view "$tag_name" >/dev/null 2>&1; then
            gh release upload "$tag_name" "${assets[@]}" --clobber
          else
            gh release create "$tag_name" "${assets[@]}" --title "NPSharp $tag_name" --generate-notes
          fi
