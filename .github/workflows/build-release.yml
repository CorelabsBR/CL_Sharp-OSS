name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "21"
  ANDROID_PLATFORM: "android-35"
  ANDROID_BUILD_TOOLS: "35.0.0"

jobs:
  verify:
    name: Validate release version and tests 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Validate tag matches package version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          expected="v${version}"
          actual="${GITHUB_REF_NAME}"
          if [ "${actual}" != "${expected}" ]; then
            echo "Tag ${actual} does not match package.json (${expected})."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint when configured
        run: npm run lint --if-present

      - name: Run tests
        run: npm test

  package-windows:
    name: Package Windows NSIS updater artifacts
    runs-on: windows-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build:renderer
      - run: npm run build:electron
      - name: Build Windows Setup, Portable and Portable Fast
        run: npx electron-builder --win nsis portable dir --x64 --publish never
      - name: Create Portable Fast archive
        run: node scripts/package-portable-fast.mjs
      - name: Validate Windows artifacts
        shell: bash
        run: |
          test -n "$(find release -maxdepth 1 -name 'NPSharp-Setup-*-x64.exe' -print -quit)"
          test -n "$(find release -maxdepth 1 -name 'NPSharp-Portable-*-x64.exe' -print -quit)"
          test -n "$(find release -maxdepth 1 -name 'NPSharp-Portable-Fast-*-x64.zip' -print -quit)"
          test -f release/latest.yml
      - name: Generate Windows checksums
        shell: bash
        run: |
          find release -maxdepth 1 -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.yml' -o -name '*.blockmap' \) -print0 \
            | sort -z | xargs -0 sha256sum > release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-updater-artifacts
          if-no-files-found: error
          path: |
            release/*.exe
            release/*-Portable-Fast-*.zip
            release/*.blockmap
            release/SHA256SUMS.txt
            release/latest.yml

  package-linux:
    name: Package Linux AppImage updater artifacts
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build:renderer
      - run: npm run build:electron
      - name: Build Linux artifacts and updater metadata
        run: npx electron-builder --linux AppImage deb --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux-updater-artifacts
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest-linux.yml

  package-android:
    name: Package Android APKs
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - run: npm ci
      - run: npm run build:renderer
      - run: npm run cap:sync
      - name: Build APKs
        working-directory: android
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          if-no-files-found: error
          path: android/app/build/outputs/apk/**/*.apk

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - package-windows
      - package-linux
      - package-android
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish updater artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(find release-assets -type f | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No updater artifacts were generated."
            exit 1
          fi
          if gh release view "${GITHUB_REF_NAME}" --repo "CoreLabsBR/CL_NPSharp" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --repo "CoreLabsBR/CL_NPSharp" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
              --repo "CoreLabsBR/CL_NPSharp" \
              --title "NPSharp ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
