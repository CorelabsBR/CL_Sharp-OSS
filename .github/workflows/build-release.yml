name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "21"
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  verify:
    name: Validate release version and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint when configured
        run: npm run lint --if-present

      - name: Run tests
        run: npm test

  package-windows:
    name: Package Windows NSIS updater artifacts
    runs-on: windows-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Restore Electron packaging cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: electron-${{ runner.os }}-x64-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-x64-

      - run: npm ci
      - run: npm run build:renderer
      - run: npm run build:electron
      - name: Build Windows Setup, Portable and Portable Fast
        shell: pwsh
        run: |
          $attempts = 3
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            npx electron-builder --win nsis portable dir --x64 --publish never
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -eq $attempts) { exit $LASTEXITCODE }
            Write-Warning "electron-builder failed on attempt $attempt; retrying in 10 seconds."
            Start-Sleep -Seconds 10
          }
      - name: Create Portable Fast archive
        run: node scripts/package-portable-fast.mjs
      - name: Validate Windows artifacts
        shell: bash
        run: |
          test -n "$(find release -maxdepth 1 -name '*-Setup-*-x64.exe' -print -quit)"
          test -n "$(find release -maxdepth 1 -name '*-Portable-*-x64.exe' -print -quit)"
          test -n "$(find release -maxdepth 1 -name '*-Portable-Fast-*-x64.zip' -print -quit)"
          test -f release/latest.yml
      - name: Generate Windows checksums
        shell: bash
        run: |
          find release -maxdepth 1 -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.yml' -o -name '*.blockmap' \) -print0 \
            | sort -z | xargs -0 sha256sum > release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-updater-artifacts
          if-no-files-found: error
          retention-days: 3
          path: |
            release/*.exe
            release/*-Portable-Fast-*.zip
            release/*.blockmap
            release/SHA256SUMS.txt
            release/latest.yml
     
  package-linux:
    name: Package Linux AppImage updater artifacts
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Restore Electron packaging cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: electron-${{ runner.os }}-x64-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-x64-

      - run: npm ci
      - run: npm run build:renderer
      - run: npm run build:electron
      - name: Build Linux artifacts and updater metadata
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npx electron-builder --linux AppImage deb --x64 --publish never; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "electron-builder failed on attempt $attempt; retrying in 10 seconds."
            sleep 10
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-updater-artifacts
          if-no-files-found: error
          retention-days: 3
          path: |
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest-linux.yml

  package-android:
    name: Package Android APKs
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Resolve Android SDK versions from config
        id: android_config
        shell: bash
        run: |
          platform="$(node -e 'process.stdout.write(`android-${require("./config.json").android.compileSdkVersion}`)')"
          build_tools="$(node -e 'process.stdout.write(require("./config.json").android.buildToolsVersion)')"
          printf 'platform=%s\n' "$platform" >> "$GITHUB_OUTPUT"
          printf 'build_tools=%s\n' "$build_tools" >> "$GITHUB_OUTPUT"

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;${{ steps.android_config.outputs.platform }}" "build-tools;${{ steps.android_config.outputs.build_tools }}"

      - run: npm ci
      - run: npm run build:renderer
      - run: npm run cap:sync
      - name: Build APKs
        working-directory: android
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          if-no-files-found: error
          retention-days: 3
          path: android/app/build/outputs/apk/**/*.apk

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - package-windows
      - package-linux
      - package-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Resolve release metadata from config
        id: release_tag
        shell: bash
        run: |
          version="$(node -e 'process.stdout.write(require("./config.json").application.version)')"
          title="$(node -e 'process.stdout.write(require("./config.json").application.displayName)')"
          printf 'value=v%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'title=%s\n' "$title" >> "$GITHUB_OUTPUT"

      - name: Create or update the release and tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          release_tag="${{ steps.release_tag.outputs.value }}"
          release_title="${{ steps.release_tag.outputs.title }}"
          mapfile -t assets < <(find release-assets -type f | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No updater artifacts were generated."
            exit 1
          fi
          if gh release view "${release_tag}" --repo "${RELEASE_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${release_tag}" "${assets[@]}" --repo "${RELEASE_REPOSITORY}" --clobber
          else
            gh release create "${release_tag}" "${assets[@]}" \
              --repo "${RELEASE_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "${release_title} ${release_tag}" \
              --generate-notes
          fi
