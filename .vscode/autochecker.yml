name: Sharp-OSS Build Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changed_files: ${{ steps.version.outputs.changed_files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Validate compile
        run: mvn -B clean compile

      - name: Calculate version
        id: version
        shell: bash
        run: |
          YEAR="$(date +%Y)"
          LAST_TAG="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"

          if [ -z "$LAST_TAG" ]; then
            LAST_TAG="v${YEAR}.0.0"
          fi

          BASE="${LAST_TAG#v}"
          LAST_YEAR="$(echo "$BASE" | cut -d. -f1)"
          LAST_MAJOR="$(echo "$BASE" | cut -d. -f2)"
          LAST_PATCH="$(echo "$BASE" | cut -d. -f3)"

          if git rev-parse "$LAST_TAG" >/dev/null 2>&1; then
            CHANGED="$(git diff --name-only "$LAST_TAG"..HEAD | wc -l | tr -d ' ')"
          else
            CHANGED=999
          fi

          if [ "$LAST_YEAR" != "$YEAR" ]; then
            MAJOR=0
            PATCH=0
          elif [ "$CHANGED" -gt 10 ]; then
            MAJOR=$((LAST_MAJOR + 1))
            PATCH=0
          else
            MAJOR="$LAST_MAJOR"
            PATCH=$((LAST_PATCH + 1))
          fi

          VERSION="v${YEAR}.${MAJOR}.${PATCH}"

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "changed_files=$CHANGED" >> "$GITHUB_OUTPUT"

  linux:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build Linux dist
        shell: bash
        run: |
          mvn -B clean package

          mkdir -p dist/linux/lib
          cp target/*.jar dist/linux/Sharp-OSS.jar
          mvn -q dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=dist/linux/lib

      - name: Build DEB
        shell: bash
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          CLEAN_VERSION="${VERSION#v}"

          rm -rf pkg
          mkdir -p pkg/DEBIAN
          mkdir -p pkg/opt/sharp/lib
          mkdir -p pkg/usr/bin
          mkdir -p pkg/usr/share/applications
          mkdir -p pkg/usr/share/icons/hicolor/256x256/apps
          mkdir -p pkg/usr/share/pixmaps

          cp dist/linux/Sharp-OSS.jar pkg/opt/sharp/
          cp -r dist/linux/lib/* pkg/opt/sharp/lib/

          cp src/main/resources/icons/app.png pkg/usr/share/icons/hicolor/256x256/apps/sharp.png
          cp src/main/resources/icons/app.png pkg/usr/share/pixmaps/sharp.png

          cat > pkg/usr/bin/sharp <<'EOF'
          #!/usr/bin/env bash
          java --module-path "/opt/sharp/lib" \
            --add-modules javafx.controls,javafx.graphics,javafx.swing \
            -cp "/opt/sharp/Sharp-OSS.jar:/opt/sharp/lib/*" \
            br.com.corelabs.sharpfx.Main
          EOF
          sed -i 's/^          //' pkg/usr/bin/sharp
          chmod +x pkg/usr/bin/sharp

          cat > pkg/usr/share/applications/sharp.desktop <<'EOF'
          [Desktop Entry]
          Version=1.0
          Name=Sharp-OSS
          GenericName=Code Editor
          Comment=CoreLabs Sharp-OSS Editor
          Exec=sharp
          Icon=sharp
          Terminal=false
          Type=Application
          Categories=Development;IDE;
          StartupNotify=true
          EOF
          sed -i 's/^          //' pkg/usr/share/applications/sharp.desktop

          cat > pkg/DEBIAN/postinst <<'EOF'
          #!/bin/sh
          set -e
          if command -v gtk-update-icon-cache >/dev/null 2>&1; then
            gtk-update-icon-cache -q /usr/share/icons/hicolor || true
          fi
          if command -v update-desktop-database >/dev/null 2>&1; then
            update-desktop-database -q /usr/share/applications || true
          fi
          exit 0
          EOF
          sed -i 's/^          //' pkg/DEBIAN/postinst
          chmod 755 pkg/DEBIAN/postinst

          cat > pkg/DEBIAN/control <<EOF
          Package: sharp
          Version: ${CLEAN_VERSION}
          Section: devel
          Priority: optional
          Architecture: amd64
          Maintainer: CoreLabs
          Depends: openjdk-17-jre | openjdk-21-jre
          Description: Sharp-OSS editor by CoreLabs
          EOF

          dpkg-deb --build pkg "Sharp-OSS-${VERSION}-linux-amd64.deb"

      - name: Build Linux portable
        shell: bash
        run: |
          VERSION="${{ needs.validate.outputs.version }}"

          rm -rf portable
          mkdir -p portable/Sharp-OSS-linux-x64/lib

          cp dist/linux/Sharp-OSS.jar portable/Sharp-OSS-linux-x64/
          cp -r dist/linux/lib/* portable/Sharp-OSS-linux-x64/lib/
          cp src/main/resources/icons/app.png portable/Sharp-OSS-linux-x64/app.png

          if [ -f LICENSE ]; then
            cp LICENSE portable/Sharp-OSS-linux-x64/LICENSE
          fi

          cat > portable/Sharp-OSS-linux-x64/sharp <<'EOF'
          #!/usr/bin/env bash
          APP_DIR="$(cd "$(dirname "$0")" && pwd)"
          java --module-path "$APP_DIR/lib" \
            --add-modules javafx.controls,javafx.graphics,javafx.swing \
            -cp "$APP_DIR/Sharp-OSS.jar:$APP_DIR/lib/*" \
            br.com.corelabs.sharpfx.Main
          EOF
          sed -i 's/^          //' portable/Sharp-OSS-linux-x64/sharp
          chmod +x portable/Sharp-OSS-linux-x64/sharp

          cd portable
          zip -r "../Sharp-OSS-${VERSION}-linux-x64-portable.zip" Sharp-OSS-linux-x64

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            Sharp-OSS-*-linux-amd64.deb
            Sharp-OSS-*-linux-x64-portable.zip

  windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y

      - name: Build Windows dist
        shell: powershell
        run: |
          mvn -B clean package

          New-Item -ItemType Directory -Force dist/windows/lib | Out-Null
          Copy-Item target/*.jar dist/windows/Sharp-OSS.jar
          mvn -q dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=dist/windows/lib

          @'
          @echo off
          setlocal
          set "APP_DIR=%~dp0"
          javaw --module-path "%APP_DIR%lib" --add-modules javafx.controls,javafx.graphics,javafx.swing -cp "%APP_DIR%Sharp-OSS.jar;%APP_DIR%lib\*" br.com.corelabs.sharpfx.Main
          if errorlevel 1 pause
          '@ | Set-Content dist/windows/run-sharp.bat -Encoding ASCII

      - name: Build Windows portable
        shell: powershell
        run: |
          $version = "${{ needs.validate.outputs.version }}"

          New-Item -ItemType Directory -Force portable/Sharp-OSS-windows-x64 | Out-Null
          Copy-Item -Recurse dist/windows/* portable/Sharp-OSS-windows-x64/
          Copy-Item src/main/resources/icons/app.png portable/Sharp-OSS-windows-x64/app.png

          if (Test-Path LICENSE) {
            Copy-Item LICENSE portable/Sharp-OSS-windows-x64/LICENSE
          }

          Compress-Archive -Path portable/Sharp-OSS-windows-x64 -DestinationPath "Sharp-OSS-$version-windows-x64-portable.zip" -Force

      - name: Ensure LICENSE exists
        shell: powershell
        run: |
          if (!(Test-Path "LICENSE")) {
            $license = @"
          MIT License

          Copyright (c) 2025-present CoreLabs

          Permission is hereby granted, free of charge, to any person obtaining a copy
          of this software and associated documentation files (the "Software"), to deal
          in the Software without restriction.

          THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND.
          "@
            $license = $license -replace "(?m)^          ", ""
            Set-Content -Path "LICENSE" -Value $license -Encoding UTF8
          }
      - name: Build wizard installer EXE
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ needs.validate.outputs.version }}" installer\Sharp-OSS.iss

          if (!(Test-Path "dist\installer\Sharp-OSS-Setup.exe")) {
            throw "Inno Setup failed: Sharp-OSS-Setup.exe was not generated."
          }

          Rename-Item dist\installer\Sharp-OSS-Setup.exe "Sharp-OSS-${{ needs.validate.outputs.version }}-Setup.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/installer/*.exe
            Sharp-OSS-*-windows-x64-portable.zip

  release:
    needs: [validate, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
          CHANGED_FILES: ${{ needs.validate.outputs.changed_files }}
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git tag "$VERSION"
          git push origin "$VERSION"

          mapfile -t ASSETS < <(find artifacts -type f \( -name "*.deb" -o -name "*.exe" -o -name "*.zip" \))

          printf 'Assets encontrados:\n'
          printf '%s\n' "${ASSETS[@]}"

          gh release create "$VERSION" "${ASSETS[@]}" \
            --title "Sharp-OSS $VERSION" \
            --notes "Build automático da main. Arquivos alterados desde a última tag: $CHANGED_FILES."
